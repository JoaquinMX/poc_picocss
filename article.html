<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Article detail from Pico News.">
    <meta name="robots" content="index,follow">
    <meta property="og:title" content="Pico News Article">
    <meta property="og:description" content="In-depth reporting from Pico News.">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://example.com/article.html">
    <meta property="og:image" content="https://example.com/assets/og-default.svg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pico News Article">
    <meta name="twitter:description" content="In-depth reporting from Pico News.">
    <meta name="twitter:image" content="https://example.com/assets/og-default.svg">
    <title>Pico News | Article</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  </head>
  <body data-page="article">
    <header>
      <nav>
        <a href="index.html" aria-label="Pico News home">Pico News</a>
        <a href="subscribe.html">Subscribe</a>
      </nav>
    </header>
    <main>
      <article>
        <header>
          <p id="article-kicker">World</p>
          <h1 id="article-title">Loading headline…</h1>
          <p id="article-deck">Summary of the article will appear here.</p>
          <p>
            <span id="article-author">By Staff</span> ·
            <time id="article-date" datetime="">—</time>
          </p>
        </header>
        <figure id="article-hero">
          <img src="assets/hero-placeholder.svg" alt="Hero image placeholder">
          <figcaption id="article-caption">Caption placeholder.</figcaption>
        </figure>
        <section id="article-content" aria-live="polite">
          <p>Loading story content…</p>
        </section>
        <section id="article-tags">
          <header>
            <h2>Tags</h2>
          </header>
          <p>—</p>
        </section>
        <section id="article-paywall">
          <header>
            <h2>Subscriber access</h2>
          </header>
          <p>Loading access status…</p>
        </section>
      </article>
      <aside>
        <section>
          <header>
            <h2>Related stories</h2>
          </header>
          <div id="related-stories"></div>
        </section>
        <section>
          <header>
            <h2>Sponsored</h2>
          </header>
          <div data-ad-slot="article-rail"></div>
        </section>
      </aside>
    </main>
    <footer>
      <nav>
        <a href="index.html">Home</a>
        <a href="subscribe.html">Subscribe</a>
      </nav>
      <small>&copy; 2024 Pico News</small>
    </footer>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
